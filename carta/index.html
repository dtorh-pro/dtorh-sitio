<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://dtorh.click/carta/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta digital para restaurantes · diseño de dtorh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carta digital con pedidos por WhatsApp y pago con Bre-B, Nequi o Daviplata.">
<meta name="theme-color" content="#14130f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&family=Archivo:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500&family=Jost:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* dtorh™ Carta v2 — base común.
   Cada tema es una identidad completa (no sigue el modo claro/oscuro del celular):
   Velada = sala de autor de noche · Brasa = afiche de local de barrio · Mañana = luz de ventana.
   El color de marca de cada restaurante entra por --marca. */
:root {
  --bg: #ffffff; --sup: #f5f5f3; --sup2: #ebebe7; --tinta: #1a1a18; --suave: #66665f;
  --linea: #dcdcd6; --marca: #1a1a18; --sobre-marca: #ffffff; --ok: #2f7d4f; --alerta: #b5401f;
  --f-disp: Georgia, serif; --f-txt: system-ui, sans-serif;
  --r: 12px; --r-s: 8px; --sombra: 0 10px 30px rgba(0,0,0,.18);
  --ancho: 1120px; --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 170px; overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--tinta);
  font: 400 16px/1.5 var(--f-txt); -webkit-font-smoothing: antialiased;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); overflow-x: clip;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.con-hoja { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--marca); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap, .demo-in { width: 100%; max-width: var(--ancho); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── barra de demostración ── */
#demo { background: #0d100f; color: #e9efe9; font: 500 13px/1.3 system-ui, sans-serif; position: relative; z-index: 26; }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; max-width: 1240px; }
.demo-marca { color: #9fb3a8; }
.demo-marca strong { color: #fff; font-weight: 600; }
.demo-volver { color: #e9efe9; text-decoration: none; }
.demo-cta { order: 3; margin-left: auto; flex: none; text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #c8f25a; color: #0f1412; }
.demo-temas { order: 4; flex-basis: 100%; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
@media (min-width: 900px) { .demo-temas { flex-basis: auto; order: 2; } }
.demo-temas::-webkit-scrollbar { display: none; }
.demo-temas a { flex: none; text-decoration: none; padding: 6px 11px; border-radius: 999px; border: 1px solid #2c3832; color: #d6e0d9; transition: background .2s, color .2s; }
.demo-temas a:hover { border-color: #5a6c62; }
.demo-temas a[aria-current] { background: #e9efe9; color: #0f1412; border-color: #e9efe9; }
.cortina { position: fixed; inset: 0; z-index: 90; pointer-events: none; }

/* ── piezas compartidas de cabecera ── */
.cab-datos { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; }
.estado { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 28%, transparent); animation: latido 2.4s ease-in-out infinite; }
.estado.off i { background: var(--alerta); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alerta) 28%, transparent); animation: none; }
@keyframes latido { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--ok) 0%, transparent); } }
.enlace { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.modos { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; max-width: 340px; }
.modos button { border: 0; background: none; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.mesa-aviso { font-size: 14px; }
.chip-repetir { justify-self: start; background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; }

/* ── navegación fija ── */
#nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.nav-in { display: grid; gap: 8px; padding-block: 10px 8px; }
.buscador { position: relative; }
.buscador svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--suave); }
.buscador input { width: 100%; border: 1px solid var(--linea); background: var(--sup); padding: 11px 12px 11px 40px; font-size: 16px; border-radius: var(--r); }
.buscador input::placeholder { color: var(--suave); }
.cats, .filtros { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar, .filtros::-webkit-scrollbar, .riel::-webkit-scrollbar { display: none; }
.cats a { flex: none; text-decoration: none; padding: 7px 13px; font-size: 14px; font-weight: 600; color: var(--suave); transition: background .25s, color .25s; }
.filtros { gap: 6px; }
.chip { flex: none; border: 1px solid var(--linea); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; transition: background .2s, color .2s; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); }

/* ── destacados ── */
#destacados { padding-block: 28px 8px; }
.sec-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.btn-asist { border: 0; background: none; font-weight: 600; font-size: 14px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
.riel { display: grid; grid-auto-flow: column; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 4px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 1152px) { .riel { padding-inline: calc((100vw - var(--ancho)) / 2 + 16px); scroll-padding-inline: calc((100vw - var(--ancho)) / 2 + 16px); } }
.dest { scroll-snap-align: start; }
.dest-btn { display: grid; width: 100%; text-align: left; border: 0; background: none; padding: 0; }
.dest-foto, .prod-foto, .ficha-img, .linea-foto, .asist-foto { display: block; overflow: hidden; background: var(--sup2); }
.dest-foto img, .prod-foto img, .ficha-img img, .linea-foto img, .asist-foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
.dest-foto img, .prod-foto img { transition: transform .7s var(--ease); }
.dest-btn:hover .dest-foto img, .prod-abrir:hover .prod-foto img { transform: scale(1.06); }
.dest-txt { display: grid; gap: 2px; }

/* ── carta ── */
.resultado { font-size: 14px; color: var(--suave); padding-top: 16px; }
.cat { scroll-margin-top: 150px; }
.prods { display: grid; }
.prod { position: relative; min-width: 0; }
.prod-abrir { display: grid; text-align: left; border: 0; background: none; padding: 0; width: 100%; color: inherit; }
.prod-txt { display: grid; gap: 4px; min-width: 0; align-content: start; }
.prod-desc { font-size: 14px; color: var(--suave); align-self: start; }
.prod-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--sup2); color: var(--suave); }
.prod-precio { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prod-precio small { font-weight: 500; font-size: .72em; opacity: .75; }
.prod-precio s { opacity: .55; font-weight: 400; font-size: .8em; margin-left: 4px; }
.prod-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn-mas { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
.btn-mas svg { width: 18px; height: 18px; }
.btn-mas:active { transform: scale(.94); }
.prod.agotado { opacity: .5; }
.prod-agotado { font-size: 13px; font-weight: 700; color: var(--alerta); }
.vacio { text-align: center; padding-block: 56px; display: grid; gap: 14px; justify-items: center; color: var(--suave); }
#pie { padding-block: 40px 28px; font-size: 13px; color: var(--suave); display: grid; gap: 4px; }

/* aparición al hacer scroll (solo lo que estaba fuera de pantalla) */
.rv.espera { opacity: 0; transform: translateY(28px); }
.rv.espera.visto { opacity: 1; transform: none; transition: opacity .7s var(--ease), transform .8s var(--ease); transition-delay: calc(var(--i, 0) * 70ms); }

/* la foto que vuela al pedido */
.vuelo { position: fixed; z-index: 70; object-fit: cover; border-radius: 50%; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.35); }

/* ── barra del pedido ── */
#barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 55%, transparent); animation: subir .45s var(--ease); }
@keyframes subir { from { transform: translateY(100%); } }
.barra-btn { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 620px; margin: 0 auto; border: 0; background: var(--marca); color: var(--sobre-marca); padding: 14px 18px; font-weight: 700; font-size: 16px; box-shadow: var(--sombra); border-radius: var(--r); }
.barra-n { min-width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in srgb, var(--sobre-marca) 22%, transparent); font-size: 14px; }
.barra-t { margin-left: auto; font-variant-numeric: tabular-nums; }
.pulso { animation: pulso .5s var(--ease); }
@keyframes pulso { 30% { transform: scale(1.04) rotate(-.6deg); } 60% { transform: scale(.99); } }

/* ── aviso ── */
#aviso { position: fixed; z-index: 60; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); width: min(460px, calc(100% - 32px)); background: var(--tinta); color: var(--bg); padding: 12px 14px; border-radius: var(--r); box-shadow: var(--sombra); font-size: 14px; opacity: 0; transition: opacity .2s, transform .25s var(--ease); display: grid; gap: 10px; }
#aviso.ver { opacity: 1; transform: translate(-50%, 0); }
.aviso-sug { display: flex; flex-wrap: wrap; gap: 6px; }
.aviso-sug button { border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); background: none; color: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

/* ── hojas ── */
.hoja { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(8,6,4,.55); opacity: 0; transition: opacity .25s; backdrop-filter: blur(2px); }
.hoja-panel { position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--bg); color: var(--tinta); border-radius: calc(var(--r) + 8px) calc(var(--r) + 8px) 0 0; transform: translateY(40px); opacity: 0; transition: transform .35s var(--ease), opacity .25s ease; overflow: hidden; }
.hoja.abierta .hoja-fondo { opacity: 1; }
.hoja.abierta .hoja-panel { transform: none; opacity: 1; }
.hoja-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--linea); }
.hoja-cab h2 { font: 600 24px/1.15 var(--f-disp); }
.hoja-cab h2 small { display: block; font: 500 13px var(--f-txt); color: var(--suave); margin-top: 4px; }
.btn-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sup2); display: grid; place-items: center; }
.btn-x svg { width: 18px; height: 18px; }
.hoja-cuerpo { overflow-y: auto; padding: 16px 18px 20px; display: grid; gap: 18px; align-content: start; overscroll-behavior: contain; }
.hoja-pie { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linea); }
@media (min-width: 720px) {
  .hoja { align-items: center; padding: 24px; }
  .hoja-panel { border-radius: calc(var(--r) + 8px); max-height: min(820px, 100%); transform: translateY(24px) scale(.98); }
  .hoja-pie { padding-bottom: 14px; }
}
#hoja-producto .hoja-cuerpo { padding-top: 0; }
.ficha-img { margin: 0 -18px; height: min(68vw, 320px); }
.ficha-img img { animation: acercar 1.2s var(--ease); }
@keyframes acercar { from { transform: scale(1.08); } }
.ficha-desc { color: var(--suave); }
.grupo { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }
.grupo legend { display: flex; justify-content: space-between; width: 100%; font-weight: 700; margin-bottom: 6px; }
.grupo legend small { font-weight: 500; color: var(--suave); font-size: 12px; }
.opcion { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--linea); border-radius: var(--r-s); background: var(--sup); cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.opcion:has(input:checked) { border-color: var(--marca); box-shadow: inset 0 0 0 1px var(--marca); }
.opcion input { width: 20px; height: 20px; accent-color: var(--marca); margin: 0; flex: none; }
.opcion em { margin-left: auto; font-style: normal; color: var(--suave); font-size: 14px; font-variant-numeric: tabular-nums; }
.opcion-pago span { display: grid; }
.opcion-pago small { color: var(--suave); font-size: 13px; }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 700; font-size: 14px; }
.opc { font-weight: 400; color: var(--suave); }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r-s); padding: 11px 12px; font-size: 16px; }
.campo [aria-invalid="true"] { border-color: var(--alerta); }
.error { color: var(--alerta); font-size: 13px; }
.error:empty { display: none; }
.ayuda { font-size: 13px; color: var(--suave); }
.combina { display: grid; gap: 8px; }
.combina h3, .asist-tit, .info-tit { font: 600 19px/1.2 var(--f-disp); }
.combina-item { display: flex; justify-content: space-between; gap: 12px; text-align: left; border: 1px dashed var(--linea); background: none; border-radius: var(--r-s); padding: 11px 12px; font-size: 14px; }
.combina-item span:last-child { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cantidad { display: inline-flex; align-items: center; border: 1px solid var(--linea); border-radius: 999px; }
.cantidad button { width: 42px; height: 42px; border: 0; background: none; font-size: 20px; display: grid; place-items: center; }
.cantidad button svg { width: 18px; height: 18px; }
.cantidad output { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.cantidad-sm button { width: 34px; height: 34px; font-size: 17px; }
.btn-pri { flex: 1; border: 0; border-radius: var(--r); background: var(--marca); color: var(--sobre-marca); font-weight: 700; font-size: 16px; padding: 14px 18px; min-height: 50px; }
.btn-pri:disabled { opacity: .45; cursor: not-allowed; }
.btn-sec { border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r-s); padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn-ancho { flex: 1; min-height: 46px; }
.btn-wa { display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; background: #1f8f4e; color: #fff; font-weight: 700; padding: 14px 18px; border-radius: var(--r); min-height: 50px; }
.progreso { display: grid; gap: 8px; font-size: 14px; }
.progreso-barra { height: 8px; border-radius: 999px; background: var(--sup2); overflow: hidden; }
.progreso-barra span { display: block; height: 100%; background: var(--ok); border-radius: inherit; transition: width .5s var(--ease); }
.lineas { list-style: none; margin: 0; padding: 0; display: grid; }
.linea { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.linea-foto { width: 56px; height: 56px; border-radius: var(--r-s); grid-row: span 2; }
.linea-txt { display: grid; gap: 2px; }
.linea-txt small { color: var(--suave); font-size: 13px; }
.linea-ctrl { display: flex; justify-content: space-between; align-items: center; grid-column: 2; }
.linea-precio { font-weight: 700; font-variant-numeric: tabular-nums; }
.totales { margin: 0; display: grid; gap: 6px; }
.totales div { display: flex; justify-content: space-between; }
.totales dt { color: var(--suave); }
.totales dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.totales-pie { width: 100%; font-size: 17px; }
.nota-min { font-size: 14px; color: var(--alerta); width: 100%; }
.conf-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px; background: var(--sup2); border-radius: var(--r); }
.conf-num { font-weight: 700; letter-spacing: .04em; }
.conf-total { font: 600 26px var(--f-disp); font-variant-numeric: tabular-nums; }
.pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: paso; }
.pasos li { display: grid; gap: 8px; padding-left: 40px; position: relative; counter-increment: paso; }
.pasos li::before { content: counter(paso); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--marca); color: var(--sobre-marca); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.pasos h3 { font-size: 16px; font-family: var(--f-txt); font-weight: 700; }
.pasos p { color: var(--suave); font-size: 14px; }
.copiable { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copiable code { flex: 1; min-width: 0; font: 600 18px ui-monospace, "SF Mono", Menlo, monospace; padding: 10px 12px; background: var(--sup2); border-radius: var(--r-s); overflow-wrap: anywhere; }
.resumen summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.resumen pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--sup2); padding: 12px; border-radius: var(--r-s); margin: 10px 0; overflow-wrap: anywhere; }
.asist-q { display: grid; gap: 8px; }
.asist-q h3 { font-size: 15px; font-family: var(--f-txt); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { padding: 9px 14px; font-size: 14px; }
.asist-lista { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.asist-lista li { display: flex; gap: 10px; align-items: center; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r-s); padding: 6px 12px 6px 6px; }
.asist-foto { width: 60px; height: 60px; flex: none; border-radius: calc(var(--r-s) - 2px); }
.asist-item { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px; display: grid; gap: 2px; }
.asist-item small { color: var(--suave); font-size: 13px; }
.asist-precio { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.asist-precio small { color: var(--suave); font-weight: 500; }
.horario { width: 100%; border-collapse: collapse; font-size: 14px; }
.horario th { text-align: left; font-weight: 500; padding: 7px 0; border-bottom: 1px solid var(--linea); }
.horario td { text-align: right; padding: 7px 0; border-bottom: 1px solid var(--linea); color: var(--suave); font-variant-numeric: tabular-nums; }
.horario tr.hoy th, .horario tr.hoy td { color: var(--tinta); font-weight: 700; }
.pausa { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 12px; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
.pausa h1 { font: 600 44px/1 var(--f-disp); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ════════════════════════════════════════════════════════════════

    if (p.modo === 'domicilio') {
      L.push('Entrega: Domicilio · ' + p.zona);
      L.push('Dirección: ' + p.cliente.dir + (p.cliente.ref ? ' (' + p.cliente.ref + ')' : ''));
    } else if (p.modo === 'recoger') {
      L.push('Entrega: Recoge en el local · ' + p.hora);
    } else {
      L.push('Entrega: Mesa ' + p.mesa);
    }
    L.push('');
    p.items.forEach(function (it) {
      var pr = IDX[it.id], ops = textoOpciones(pr, it.opts);
      L.push(it.qty + ' × ' + pr.nombre + ' — ' + fmt(it.unit * it.qty));
      if (ops.length) L.push('    ' + ops.join(', '));
      if (it.nota) L.push('    Nota: ' + it.nota);
    });
    L.push('');
    L.push('Subtotal: ' + fmt(p.subtotal));
    if (p.modo === 'domicilio') L.push('Domicilio: ' + (p.domicilio ? fmt(p.domicilio) : 'Gratis'));
    L.push('*Total: ' + fmt(p.total) + '*');
    L.push('');
    var pg = p.pago;
    L.push('Pago: ' + pg.nombre + (pg.llave ? ' (llave ' + pg.llave + ')' : '') + (pg.numero ? ' (' + pg.numero + ')' : ''));
    if (pg.cambio && p.cambio) L.push('Paga con: ' + p.cambio);
    if (pg.llave || pg.numero) L.push('Envío el comprobante en este chat.');
    if (p.nota) { L.push(''); L.push('Nota: ' + p.nota); }
    return L.join('\n');
  }
  function enlaceWA(texto) {
    var num = String(R.whatsapp || '').replace(/\D/g, '');
    return 'https://wa.me/' + (num || '') + '?text=' + encodeURIComponent(texto);
  }

  function confirmar(p) {
    var txt = mensaje(p), pg = p.pago;
    var pagoDigital = pg.llave || pg.numero;
    var cuerpo =
      '<div class="conf-cab"><p class="conf-num">Pedido ' + esc(p.id) + '</p><p class="conf-total">' + fmt(p.total) + '</p></div>' +
      '<ol class="pasos">' +
        '<li><h3>Envía el pedido por WhatsApp</h3><p>Ya va escrito. Solo toca enviar. ' + esc(R.nombre) + ' te confirma el pedido y el tiempo' + (p.modo === 'domicilio' ? ' de entrega' : '') + '.</p>' +
          '<a class="btn-wa" href="' + enlaceWA(txt) + '" target="_blank" rel="noopener">Enviar por WhatsApp</a>' +
          (DEMO || !R.whatsapp ? '<p class="ayuda">En la demostración WhatsApp te deja elegir el chat. En la carta real va directo al número del restaurante.</p>' : '') + '</li>' +
        (pagoDigital ? '<li><h3>Paga ' + fmt(p.total) + ' con ' + esc(pg.nombre) + '</h3>' +
          (pg.llave ? '<p>En la app de tu banco o billetera entra a <strong>Bre-B</strong>, elige enviar a una llave y pega esta:</p>'
                    : '<p>Envía a este número desde tu app:</p>') +
          '<div class="copiable"><code data-copiable>' + esc(pg.llave || pg.numero) + '</code><button type="button" class="btn-sec" data-copiar="' + esc(pg.llave || pg.numero) + '">Copiar</button></div>' +
          '<p class="ayuda">Antes de confirmar, revisa que el nombre que muestra tu app sea ' + esc(R.nombre) + '.</p></li>' +
          '<li><h3>Manda el comprobante en el mismo chat</h3><p>Con eso el pedido entra a cocina.</p></li>'
          : '<li><h3>Paga al ' + (p.modo === 'mesa' ? 'final' : 'recibir') + '</h3><p>' + esc(pg.detalle || '') + (p.cambio ? '. Llevan cambio de ' + esc(p.cambio) + '.' : '.') + '</p></li>') +
      '</ol>' +
      '<details class="resumen"><summary>Ver el mensaje del pedido</summary><pre data-copiable>' + esc(txt) + '</pre><button type="button" class="btn-sec" data-copiar-pedido>Copiar el pedido</button></details>';
    var pie = '<button type="button" class="btn-sec btn-ancho" data-nuevo>Hacer otro pedido</button>';
    var h = hoja('hoja-confirmacion', '¡Listo, ' + esc(p.cliente.nombre.split(' ')[0]) + '!', cuerpo, pie);
    h.onclick = function (ev) {
      var c = ev.target.closest('[data-copiar]'); if (c) copiar(c.getAttribute('data-copiar'), c);
      var cp = ev.target.closest('[data-copiar-pedido]'); if (cp) copiar(txt, cp);
      if (ev.target.closest('[data-nuevo]')) { S.cart = []; guardarCarrito(); cerrarTodo(); pintarTodo(); }
    };
    abrir('hoja-confirmacion');
  }

  /* ───────── asistente "¿no sabes qué pedir?" ───────── */
  function verAsistente() {
    var paso = { personas: 1, antojo: null, presupuesto: 'medio' };
    function chips(name, lista, val) {
      return '<div class="chips" role="radiogroup">' + lista.map(function (x) {
        return '<button type="button" class="chip" role="radio" aria-checked="' + (val === x[0]) + '" data-a="' + name + '" data-v="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div>';
    }
    function pintar() {
      var cuerpo =
        '<div class="asist-q"><h3>¿Para cuántos?</h3>' + chips('personas', [[1, 'Solo yo'], [2, 'Para dos'], [4, '3 o más']], paso.personas) + '</div>' +
        '<div class="asist-q"><h3>¿Qué se te antoja?</h3>' + chips('antojo', R.asistente.antojos.map(function (a) { return [a.id, a.label]; }), paso.antojo) + '</div>' +
        '<div class="asist-q"><h3>¿Cuánto quieres gastar por persona?</h3>' + chips('presupuesto', [['bajo', 'Poco'], ['medio', 'Normal'], ['alto', 'Darme un gusto']], paso.presupuesto) + '</div>' +
        '<div id="asist-res" aria-live="polite">' + resultados() + '</div>';
      var h = hoja('hoja-asistente', 'Te ayudamos a elegir', cuerpo);
      h.onclick = function (ev) {
        var b = ev.target.closest('[data-a]'); if (!b) return;
        var k = b.getAttribute('data-a'), v = b.getAttribute('data-v');
        paso[k] = k === 'personas' ? +v : v;
        var y = $('.hoja-cuerpo', h).scrollTop; pintar(); $('.hoja-cuerpo', h).scrollTop = y;
      };
      return h;
    }
    function resultados() {
      if (!paso.antojo) return '<p class="ayuda">Elige un antojo y te mostramos tres opciones.</p>';
      var cand = todos().filter(function (p) { return !p.agotado && (p.antojos || []).indexOf(paso.antojo) > -1; });
      // el presupuesto se mide contra el precio por persona de lo que coincide con el antojo
      var pp = cand.map(function (p) { return p.precio / (p.personas || 1); }).sort(function (a, b) { return a - b; });
      function qc(n) { return pp[Math.floor((pp.length - 1) * n)] || 0; }
      var tope = paso.presupuesto === 'bajo' ? qc(0.4) : paso.presupuesto === 'medio' ? qc(0.85) * 1.15 : Infinity;
      cand.forEach(function (p) {
        var s = 0, porPersona = p.precio / (p.personas || 1);
        if ((p.tags || []).indexOf('popular') > -1) s += 3;
        if ((p.tags || []).indexOf('nuevo') > -1) s += 1;
        if (paso.personas > 1 && (p.personas || 1) >= paso.personas) s += 7;
        else if (paso.personas > 1 && ((p.tags || []).indexOf('compartir') > -1 || (p.personas || 1) > 1)) s += 4;
        if (paso.personas === 1 && (p.personas || 1) > 1) s -= 5;
        if (porPersona <= tope) s += 2; else s -= 3;
        if (paso.presupuesto === 'alto') s += porPersona / 20000;
        p._s = s;
      });
      cand.sort(function (a, b) { return b._s - a._s; });
      cand = cand.slice(0, 3);
      if (!cand.length) return '<p class="ayuda">Con esa combinación no hay opciones. Prueba otro antojo.</p>';
      return '<h3 class="asist-tit">Te recomendamos</h3><ul class="asist-lista">' + cand.map(function (p) {
        var cant = paso.personas > 1 && !(p.personas > 1) && (p.tags || []).indexOf('compartir') < 0 ? paso.personas === 4 ? 3 : 2 : 1;
        return '<li><span class="asist-foto">' + foto(p.id, '') + '</span><button type="button" class="asist-item" data-ver="' + p.id + '"><strong>' + esc(p.nombre) + '</strong><small>' + esc(p.desc) + '</small></button>' +
          '<span class="asist-precio">' + fmt(p.precio) + (cant > 1 ? ' <small>× ' + cant + '</small>' : '') + '</span></li>';
      }).join('') + '</ul>';
    }
    pintar(); abrir('hoja-asistente');
  }

  /* ───────── información ───────── */
  function verInfo() {
    var hoy = ahoraCO().dia;
    var orden = [1, 2, 3, 4, 5, 6, 0];
    var cuerpo = '<h3 class="info-tit">Horario</h3><table class="horario"><tbody>' + orden.map(function (d) {
      var f = R.horario[d] || [];
      return '<tr' + (d === hoy ? ' class="hoy"' : '') + '><th scope="row">' + DIAS[d] + '</th><td>' + (f.length ? f.map(function (x) { return hora12(x[0]) + ' – ' + hora12(x[1]); }).join(' y ') : 'Cerrado') + '</td></tr>';
    }).join('') + '</tbody></table>' +
      '<h3 class="info-tit">Domicilios</h3><table class="horario"><tbody>' + R.zonas.map(function (z) { return '<tr><th scope="row">' + esc(z.nombre) + '</th><td>' + fmt(z.costo) + '</td></tr>'; }).join('') + '</tbody></table>' +
      (R.domicilioGratisDesde ? '<p class="ayuda">Domicilio gratis en pedidos desde ' + fmt(R.domicilioGratisDesde) + '.</p>' : '') +
      '<h3 class="info-tit">Medios de pago</h3><p>' + R.pagos.map(function (p) { return esc(p.nombre); }).join(' · ') + '</p>' +
      '<h3 class="info-tit">Dónde estamos</h3><p>' + esc(R.direccion) + '</p>' +
      (R.instagram ? '<p><a href="https://instagram.com/' + esc(R.instagram) + '" target="_blank" rel="noopener">Instagram @' + esc(R.instagram) + '</a></p>' : '');
    hoja('hoja-info', esc(R.nombre), cuerpo); abrir('hoja-info');
  }

  /* ───────── reservas ───────── */
  function verReserva() {
    var n = ahoraCO();
    var cuerpo = '<form id="f-reserva" novalidate>' +
      '<div class="campo"><label for="r-fecha">Fecha</label><input id="r-fecha" type="date" min="' + n.fecha + '" value="' + n.fecha + '" required></div>' +
      '<div class="campo"><label for="r-hora">Hora</label><select id="r-hora">' + ['12:30', '13:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30'].map(function (t) { return '<option>' + hora12(t) + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label for="r-pers">Personas</label><select id="r-pers">' + [2, 3, 4, 5, 6, 8, 10].map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label for="r-nombre">A nombre de</label><input id="r-nombre" autocomplete="name" required value="' + esc((store.get('carta:cliente') || {}).nombre || '') + '"></div>' +
      '<div class="campo"><label for="r-ocasion">¿Celebran algo? <span class="opc">opcional</span></label><input id="r-ocasion" placeholder="Cumpleaños, aniversario…"></div>' +
      '</form>';
    var h = hoja('hoja-reserva', 'Reservar mesa', cuerpo, '<button type="submit" form="f-reserva" class="btn-pri" data-foco>Pedir la reserva por WhatsApp</button>');
    $('#f-reserva', h).onsubmit = function (ev) {
      ev.preventDefault();
      var nom = $('#r-nombre', h).value.trim(); if (!nom) { $('#r-nombre', h).focus(); aviso('Escribe a nombre de quién va la reserva'); return; }
      var f = $('#r-fecha', h).value.split('-');
      var txt = '*Solicitud de reserva* · ' + R.nombre + '\n\nFecha: ' + f[2] + '/' + f[1] + '/' + f[0] + '\nHora: ' + $('#r-hora', h).value + '\nPersonas: ' + $('#r-pers', h).value + '\nA nombre de: ' + nom + ($('#r-ocasion', h).value.trim() ? '\nOcasión: ' + $('#r-ocasion', h).value.trim() : '');
      var a = document.createElement('a'); a.href = enlaceWA(txt); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      cerrar(); aviso('Abrimos WhatsApp con tu solicitud. El restaurante te confirma la mesa.', 5000);
    };
    abrir('hoja-reserva');
  }

  /* ───────── licencia ───────── */
  function licenciaVigente() {
    if (!R.licencia || !R.licencia.vence) return true;
    var v = new Date(R.licencia.vence + 'T23:59:59-05:00').getTime() + 3 * 86400000; // 3 días de gracia
    return Date.now() <= v;
  }
  function pintarPausa() {
    document.body.classList.add('en-pausa');
    $('#app').innerHTML = '<div class="pausa"><h1>' + esc(R.nombre) + '</h1><p>La carta digital está en pausa por ahora.</p>' +
      '<p class="ayuda">Si eres cliente, puedes pedir por WhatsApp o en el local.</p>' +
      (R.whatsapp ? '<a class="btn-wa" href="https://wa.me/' + String(R.whatsapp).replace(/\D/g, '') + '" target="_blank" rel="noopener">Escribir al restaurante</a>' : '') + '</div>';
  }

  /* ───────── demo ───────── */
  function pintarDemo() {
    var el = $('#demo'); if (!el) return;
    if (!DEMO) { el.hidden = true; return; }
    var temas = { velada: 'Velada · gourmet', brasa: 'Brasa · comida rápida', manana: 'Mañana · café y brunch' };
    el.hidden = false;
    var cta = window.CARTA_CTA;
    el.innerHTML = '<div class="demo-in"><p class="demo-marca">' + (cta ? '<a class="demo-volver" href="' + esc(cta.volver) + '">← dtorh.click</a> · ' : '') +
      '<strong>dtorh™ Carta</strong> · restaurantes de muestra</p>' +
      (cta ? '<a class="demo-cta" href="' + esc(cta.url) + '">' + esc(cta.texto) + '</a>' : '') +
      '<nav class="demo-temas" aria-label="Temas de muestra">' +
      Object.keys(CARTAS).map(function (k) {
        var c = CARTAS[k];
        return '<a href="#' + k + '"' + (R.slug === k && S.modo !== 'mesa' ? ' aria-current="page"' : '') + '>' + temas[c.tema] + '</a>';
      }).join('') + '<a href="#' + R.slug + '-mesa-7"' + (S.modo === 'mesa' ? ' aria-current="page"' : '') + '>Modo mesa (QR)</a></nav></div>';
  }

  /* ───────── arranque ───────── */
  function pintarTodo() {
    pintarDemo();
    if (!licenciaVigente()) { pintarPausa(); return; }
    document.body.classList.remove('en-pausa');
    pintarCabecera(); pintarPromo(); pintarDestacados(); pintarNav(); pintarMenu(); pintarBarra();
    $('#pie').innerHTML = '<p>Precios en pesos colombianos, con impuestos incluidos.</p><p><a href="https://dtorh.click" target="_blank" rel="noopener">Carta digital por dtorh™</a> · v' + VERSION + '</p>';
  }

  function leerRuta() {
    var h = (location.hash || '').replace('#', '');
    var m = h.match(/^(?:([a-z0-9]+)-)?mesa-(\d{1,3})$/) || h.match(/^([a-z0-9]+)()$/);
    var q = new URLSearchParams(location.search);
    var slug;
    if (!DEMO && window.CARTA_SLUG) slug = window.CARTA_SLUG;   // carta real: siempre su restaurante
    else slug = (m && m[1] && CARTAS[m[1]]) ? m[1] : (q.get('r') && CARTAS[q.get('r')] ? q.get('r') : (window.CARTA_SLUG || Object.keys(CARTAS)[0]));
    var mesa = (m && m[2]) || q.get('mesa');
    return { slug: slug, mesa: mesa };
  }

  function iniciar() {
    var ruta = leerRuta();
    if (/^cat-/.test((location.hash || '').slice(1)) && R) return; // salto a sección
    cerrarTodo();
    R = CARTAS[ruta.slug]; IDX = {}; CAT_DE = {};
    R.categorias.forEach(function (c) { c.productos.forEach(function (p) { IDX[p.id] = p; CAT_DE[p.id] = c.id; }); });
    S = { cart: [], modo: R.modos[0], mesa: null, filtros: [], q: '', zona: null };
    cargarCarrito();
    if (ruta.mesa && R.modos.indexOf('mesa') > -1) { S.modo = 'mesa'; S.mesa = ruta.mesa; }
    var fl = $('#flota'); if (fl) fl.classList.remove('ver');
    aplicarMarca(); pintarTodo();
    window.scrollTo(0, 0);
  }

  /* ───────── eventos ───────── */
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var b;
    if ((b = t.closest('.demo-temas a'))) { cambiarConCortina(ev, b); return; }
    if ((b = t.closest('.hv-bajar'))) { ev.preventDefault(); $('#nav').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
    if ((b = t.closest('[data-cat]'))) {
      ev.preventDefault();
      var s = document.getElementById('cat-' + b.getAttribute('data-cat'));
      if (s) s.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    if ((b = t.closest('[data-mas]'))) {
      origen = b.closest('.prod, .dest, .hoja-panel, .combina-item') ;
      var p = IDX[b.getAttribute('data-mas')];
      if (b.hasAttribute('data-desde-aviso')) ocultarAviso();
      if (necesitaFicha(p) && !b.closest('.hoja')) { verProducto(p.id); return; }
      if (necesitaFicha(p) && b.closest('.hoja')) { agregar(p.id, opcionesPorDefecto(p), 1, ''); }
      else agregar(p.id, {}, 1, '');
      if (b.hasAttribute('data-refrescar')) verCarritoSinAbrir();
      return;
    }
    if ((b = t.closest('[data-ver]'))) { if (b.closest('#hoja-asistente')) cerrar(); verProducto(b.getAttribute('data-ver')); return; }
    if (t.closest('[data-carrito]')) { verCarrito(); return; }
    if (t.closest('[data-checkout]')) { verCheckout(); return; }
    if (t.closest('[data-asistente]')) { verAsistente(); return; }
    if (t.closest('[data-info]')) { verInfo(); return; }
    if (t.closest('[data-reservar]')) { verReserva(); return; }
    if ((b = t.closest('[data-modo]'))) {
      S.modo = b.getAttribute('data-modo'); guardarCarrito(); pintarCabecera(); pintarBarra(); return;
    }
    if ((b = t.closest('[data-filtro]'))) {
      var f = b.getAttribute('data-filtro'), i = S.filtros.indexOf(f);
      if (i > -1) S.filtros.splice(i, 1); else S.filtros.push(f);
      b.setAttribute('aria-pressed', i < 0); pintarMenu(); return;
    }
    if (t.closest('[data-limpiar]')) { S.q = ''; S.filtros = []; pintarNav(); pintarMenu(); return; }
    if (t.closest('[data-repetir]')) {
      var u = store.get('carta:' + R.slug + ':ultimo'), n = 0;
      (u.items || []).forEach(function (it) { if (IDX[it.id] && !IDX[it.id].agotado) { S.cart.push({ key: it.id + '|' + JSON.stringify(it.opts) + '|' + (it.nota || ''), id: it.id, opts: it.opts, qty: it.qty, nota: it.nota || '', unit: precioLinea(IDX[it.id], it.opts) }); n++; } });
      guardarCarrito(); pintarBarra(); pintarMenu();
      aviso(n ? 'Agregamos tu último pedido. Revísalo antes de confirmar.' : 'Los productos de tu último pedido no están disponibles hoy.');
      return;
    }
  });
  var tq = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'q') return;
    clearTimeout(tq);
    tq = setTimeout(function () { S.q = ev.target.value.trim(); pintarMenu(); }, 120);
  });
  window.addEventListener('hashchange', iniciar);
  setInterval(function () { if (R && licenciaVigente() && !pila.length) pintarCabecera(); }, 60000);

  function arrancar() { previaFlotante(); iniciar(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();

</script>
