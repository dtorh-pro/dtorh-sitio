<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">

<title>Carta digital para restaurantes · diseño de dtorh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carta digital con pedidos por WhatsApp y pago con Bre-B, Nequi o Daviplata.">
<meta name="theme-color" content="#14130f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* dtorh™ Carta — estilos del motor + 3 temas.
   Concepto: una columna de lectura tipo carta impresa, navegación fija arriba
   y el pedido siempre a un toque abajo. Cada tema es una identidad completa
   y deliberada (no sigue el modo claro/oscuro del celular); el color de marca
   del restaurante entra por --marca. */

:root {
  --bg: #ffffff; --sup: #f5f5f3; --sup2: #ebebe7; --tinta: #1a1a18; --suave: #66665f;
  --linea: #dcdcd6; --marca: #1a1a18; --sobre-marca: #ffffff; --ok: #2f7d4f; --alerta: #b5401f;
  --f-disp: Georgia, serif; --f-txt: system-ui, sans-serif;
  --r: 12px; --r-s: 8px; --sombra: 0 10px 30px rgba(0,0,0,.18);
  --ancho: 760px;
  color-scheme: light;
}

/* ── Tema VELADA · gourmet: sala con poca luz, oro viejo, tipografía de carta de autor ── */
:root[data-tema="velada"] {
  --bg: #14130f; --sup: #1c1a15; --sup2: #26231c; --tinta: #efe8da; --suave: #a89f8d;
  --linea: #3a352b; --marca: #c9a25e; --sobre-marca: #17140d; --ok: #8fbf8a; --alerta: #e08a6a;
  --f-disp: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-txt: "Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --r: 3px; --r-s: 2px; --sombra: 0 18px 50px rgba(0,0,0,.55);
  color-scheme: dark;
}
/* ── Tema BRASA · comida rápida: letrero de local, rojo brasa y mostaza ── */
:root[data-tema="brasa"] {
  --bg: #ffffff; --sup: #f6f2ed; --sup2: #ece5dc; --tinta: #1b1512; --suave: #6a5d55;
  --linea: #e4dbd1; --marca: #e8481f; --sobre-marca: #ffffff; --ok: #1f7a43; --alerta: #c2341a;
  --mostaza: #ffc233;
  --f-disp: "Anton", "Impact", "Arial Narrow", sans-serif;
  --f-txt: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r: 16px; --r-s: 10px; --sombra: 0 14px 34px rgba(60,20,5,.22);
  color-scheme: light;
}
/* ── Tema MAÑANA · café y brunch: luz de ventana, verde hoja y mantequilla ── */
:root[data-tema="manana"] {
  --bg: #f3f5ef; --sup: #ffffff; --sup2: #e7ece2; --tinta: #1f2a22; --suave: #5b685e;
  --linea: #d6ddd1; --marca: #3f6b4e; --sobre-marca: #ffffff; --ok: #2f7d4f; --alerta: #b5401f;
  --mantequilla: #f1d488;
  --f-disp: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-txt: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --r: 20px; --r-s: 12px; --sombra: 0 14px 34px rgba(31,42,34,.16);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 150px; }
body {
  margin: 0; background: var(--bg); color: var(--tinta);
  font: 400 16px/1.5 var(--f-txt); -webkit-font-smoothing: antialiased;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.con-hoja { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.wrap, .demo-in { max-width: var(--ancho); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── barra de demostración ── */
#demo { background: #0f1412; color: #e9efe9; font: 500 13px/1.3 system-ui, sans-serif; }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; max-width: 1100px; }
.demo-marca { color: #9fb3a8; }
.demo-marca strong { color: #fff; font-weight: 600; }
.demo-volver { color: #e9efe9; text-decoration: none; }
.demo-cta { order: 3; margin-left: auto; flex: none; text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #c8f25a; color: #0f1412; }
.demo-temas { order: 4; flex-basis: 100%; }
@media (min-width: 900px) { .demo-temas { flex-basis: auto; order: 2; } }
.demo-temas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.demo-temas a { flex: none; text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid #2c3832; color: #d6e0d9; }
.demo-temas a[aria-current] { background: #e9efe9; color: #0f1412; border-color: #e9efe9; }

/* ── cabecera ── */
#cabecera { display: grid; gap: 14px; padding-block: 28px 18px; }
.cab-lema { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
.cab-nombre { font: 600 clamp(40px, 11vw, 64px)/.95 var(--f-disp); letter-spacing: -.01em; }
.cab-datos { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; color: var(--suave); }
.estado { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--tinta); }
.estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.estado.off i { background: var(--alerta); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alerta) 25%, transparent); }
.enlace { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--tinta); font-size: 14px; }
.modos { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sup2); border-radius: calc(var(--r) + 2px); padding: 3px; max-width: 360px; }
.modos button { border: 0; background: none; padding: 9px 12px; border-radius: var(--r); font-weight: 600; font-size: 14px; color: var(--suave); }
.modos button[aria-checked="true"] { background: var(--sup); color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.mesa-aviso { padding: 10px 14px; border-radius: var(--r-s); background: var(--sup2); font-size: 14px; }
.chip-repetir { justify-self: start; border: 1px dashed var(--suave); background: none; border-radius: 999px; padding: 7px 14px; font-size: 14px; }

/* ── promo ── */
#promo { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--sup2); margin-bottom: 8px; font-size: 14px; }
.promo-etq { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--marca); color: var(--sobre-marca); padding: 3px 8px; border-radius: 999px; }

/* ── destacados ── */
#destacados { padding-block: 18px 6px; }
.sec-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.sec-cab h2 { font: 600 22px/1.1 var(--f-disp); }
.btn-asist { border: 0; background: none; color: var(--marca); font-weight: 600; font-size: 14px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.riel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 42%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
.dest { scroll-snap-align: start; }
.dest-btn { width: 100%; text-align: left; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; }
.dest-img { display: grid; place-items: center; aspect-ratio: 4 / 3; border-radius: var(--r-s); background: var(--sup2); color: var(--marca); }
.dest-img svg { width: 44%; height: auto; }
.dest-nom { font-weight: 600; font-size: 14px; line-height: 1.25; }
.dest-precio { font-size: 14px; color: var(--suave); font-variant-numeric: tabular-nums; }

/* ── navegación fija ── */
#nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 10px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--linea); }
.buscador { position: relative; }
.buscador svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--suave); }
.buscador input { width: 100%; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r); padding: 11px 12px 11px 38px; font-size: 16px; }
.buscador input::placeholder { color: var(--suave); }
.cats { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar, .riel::-webkit-scrollbar, .demo-temas::-webkit-scrollbar { display: none; }
.cats a { flex: none; text-decoration: none; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--suave); }
.cats a[aria-selected="true"] { background: var(--tinta); color: var(--bg); }
.filtros { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--linea); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); }

/* ── carta ── */
#menu { padding-block: 8px 24px; }
.resultado { font-size: 14px; color: var(--suave); padding-top: 12px; }
.cat { padding-top: 26px; scroll-margin-top: 150px; }
.cat-tit { font: 600 28px/1.1 var(--f-disp); display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.cat-tit span { font: 500 13px var(--f-txt); color: var(--suave); }
.prods { display: grid; gap: 12px; }
.prod { position: relative; display: grid; grid-template-columns: 1fr; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r); overflow: hidden; }
.prod-abrir { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; text-align: left; border: 0; background: none; padding: 14px 14px 0; }
.prod-img { display: grid; place-items: center; width: 76px; height: 76px; border-radius: var(--r-s); background: var(--sup2); color: var(--marca); }
.prod-img svg { width: 46%; }
.prod-txt { display: grid; gap: 4px; min-width: 0; }
.prod-nom { font-weight: 700; font-size: 16px; line-height: 1.25; }
.prod-desc { font-size: 14px; color: var(--suave); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; background: var(--sup2); color: var(--suave); }
.tag-popular { background: color-mix(in srgb, var(--marca) 16%, transparent); color: var(--tinta); }
.tag-picante { color: var(--alerta); }
.prod-pie { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 14px 104px; }
.prod-precio { font-weight: 700; font-variant-numeric: tabular-nums; }
.prod-precio small { font-weight: 500; color: var(--suave); font-size: 12px; }
.prod-precio s { color: var(--suave); font-weight: 400; font-size: 13px; margin-left: 4px; }
.btn-mas { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--marca); color: var(--sobre-marca); display: grid; place-items: center; }
.btn-mas svg { width: 20px; height: 20px; }
.btn-mas b { font-size: 15px; }
.prod.agotado { opacity: .55; }
.prod-agotado { font-size: 13px; font-weight: 600; color: var(--alerta); }
.vacio { text-align: center; padding: 48px 0; display: grid; gap: 14px; justify-items: center; color: var(--suave); }

#pie { padding-block: 32px 24px; font-size: 13px; color: var(--suave); display: grid; gap: 4px; border-top: 1px solid var(--linea); margin-top: 24px; }

/* ── barra del pedido ── */
#barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 60%, transparent); }
.barra-btn { display: flex; align-items: center; gap: 12px; width: 100%; max-width: calc(var(--ancho) - 32px); margin: 0 auto; border: 0; border-radius: calc(var(--r) + 4px); background: var(--marca); color: var(--sobre-marca); padding: 14px 18px; font-weight: 700; font-size: 16px; box-shadow: var(--sombra); }
.barra-n { min-width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: color-mix(in srgb, var(--sobre-marca) 22%, transparent); font-size: 14px; }
.barra-t { margin-left: auto; font-variant-numeric: tabular-nums; }
.pulso { animation: pulso .45s ease; }
@keyframes pulso { 40% { transform: scale(1.03); } }

/* ── aviso ── */
#aviso { position: fixed; z-index: 60; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); width: min(460px, calc(100% - 32px)); background: var(--tinta); color: var(--bg); padding: 12px 14px; border-radius: var(--r); box-shadow: var(--sombra); font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; display: grid; gap: 10px; }
#aviso.ver { opacity: 1; transform: translate(-50%, 0); }
.aviso-sug { display: flex; flex-wrap: wrap; gap: 6px; }
.aviso-sug button { border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); background: none; color: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }

/* ── hojas ── */
.hoja { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; }
.hoja-panel { position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--bg); color: var(--tinta); border-radius: calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0; transform: translateY(30px); opacity: 0; transition: transform .22s ease, opacity .22s ease; }
.hoja.abierta .hoja-fondo { opacity: 1; }
.hoja.abierta .hoja-panel { transform: none; opacity: 1; }
.hoja-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--linea); }
.hoja-cab h2 { font: 600 24px/1.15 var(--f-disp); }
.hoja-cab h2 small { display: block; font: 500 13px var(--f-txt); color: var(--suave); margin-top: 4px; }
.btn-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sup2); display: grid; place-items: center; }
.btn-x svg { width: 18px; height: 18px; }
.hoja-cuerpo { overflow-y: auto; padding: 16px 18px 20px; display: grid; gap: 18px; align-content: start; overscroll-behavior: contain; }
.hoja-pie { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linea); }
@media (min-width: 720px) {
  .hoja { align-items: center; padding: 24px; }
  .hoja-panel { border-radius: calc(var(--r) + 6px); max-height: min(780px, 100%); }
  .hoja-pie { padding-bottom: 14px; }
}

.con-foto { overflow: hidden; padding: 0; }
.con-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
[data-tema="velada"] .prods .prod-img.con-foto, [data-tema="velada"] .ficha-img.con-foto { display: grid; }
.ficha-img { display: grid; place-items: center; height: 150px; border-radius: var(--r); background: var(--sup2); color: var(--marca); }
.ficha-img svg { width: 64px; }
.ficha-desc { color: var(--suave); }
.grupo { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.grupo legend { display: flex; justify-content: space-between; width: 100%; font-weight: 700; margin-bottom: 6px; }
.grupo legend small { font-weight: 500; color: var(--suave); font-size: 12px; }
.opcion { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--linea); border-radius: var(--r-s); background: var(--sup); cursor: pointer; }
.opcion:has(input:checked) { border-color: var(--marca); box-shadow: inset 0 0 0 1px var(--marca); }
.opcion input { width: 20px; height: 20px; accent-color: var(--marca); margin: 0; flex: none; }
.opcion em { margin-left: auto; font-style: normal; color: var(--suave); font-size: 14px; font-variant-numeric: tabular-nums; }
.opcion-pago span { display: grid; }
.opcion-pago small { color: var(--suave); font-size: 13px; }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 700; font-size: 14px; }
.opc { font-weight: 400; color: var(--suave); }
.campo input, .campo select, .campo textarea { width: 100%; border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r-s); padding: 11px 12px; font-size: 16px; }
.campo [aria-invalid="true"] { border-color: var(--alerta); }
.error { color: var(--alerta); font-size: 13px; }
.error:empty { display: none; }
.ayuda { font-size: 13px; color: var(--suave); }
.combina { display: grid; gap: 8px; }
.combina h3, .asist-tit, .info-tit { font: 600 18px/1.2 var(--f-disp); }
.combina-item { display: flex; justify-content: space-between; gap: 12px; text-align: left; border: 1px dashed var(--linea); background: none; border-radius: var(--r-s); padding: 11px 12px; font-size: 14px; }
.combina-item span:last-child { color: var(--suave); font-variant-numeric: tabular-nums; white-space: nowrap; }

.cantidad { display: inline-flex; align-items: center; border: 1px solid var(--linea); border-radius: 999px; }
.cantidad button { width: 42px; height: 42px; border: 0; background: none; font-size: 20px; display: grid; place-items: center; }
.cantidad button svg { width: 18px; height: 18px; }
.cantidad output { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.cantidad-sm button { width: 34px; height: 34px; font-size: 17px; }
.btn-pri { flex: 1; border: 0; border-radius: var(--r); background: var(--marca); color: var(--sobre-marca); font-weight: 700; font-size: 16px; padding: 14px 18px; min-height: 48px; }
.btn-pri:disabled { opacity: .45; cursor: not-allowed; }
.btn-sec { border: 1px solid var(--linea); background: var(--sup); border-radius: var(--r-s); padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn-ancho { flex: 1; min-height: 46px; }
.btn-wa { display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; background: #1f8f4e; color: #fff; font-weight: 700; padding: 14px 18px; border-radius: var(--r); min-height: 48px; }

.progreso { display: grid; gap: 8px; font-size: 14px; }
.progreso-barra { height: 8px; border-radius: 999px; background: var(--sup2); overflow: hidden; }
.progreso-barra span { display: block; height: 100%; background: var(--ok); border-radius: inherit; transition: width .3s; }
.lineas { list-style: none; margin: 0; padding: 0; display: grid; }
.linea { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.linea-txt { display: grid; gap: 2px; }
.linea-txt small { color: var(--suave); font-size: 13px; }
.linea-ctrl { display: flex; justify-content: space-between; align-items: center; }
.linea-precio { font-weight: 700; font-variant-numeric: tabular-nums; }
.totales { margin: 0; display: grid; gap: 6px; }
.totales div { display: flex; justify-content: space-between; }
.totales dt { color: var(--suave); }
.totales dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.totales-pie { width: 100%; font-size: 17px; }
.nota-min { font-size: 14px; color: var(--alerta); width: 100%; }

.conf-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px; background: var(--sup2); border-radius: var(--r); }
.conf-num { font-weight: 700; letter-spacing: .04em; }
.conf-total { font: 600 26px var(--f-disp); font-variant-numeric: tabular-nums; }
.pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: paso; }

  /* ───────── mensaje de WhatsApp ───────── */
  function mensaje(p) {
    var L = [];
    L.push('*Pedido ' + p.id + '* · ' + R.nombre);
    if (p.programado) L.push('_Pedido programado: llegó con el local cerrado_');
    L.push('');
    L.push('Cliente: ' + p.cliente.nombre + ' · ' + p.cliente.cel.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3'));
    if (p.modo === 'domicilio') {
      L.push('Entrega: Domicilio · ' + p.zona);
      L.push('Dirección: ' + p.cliente.dir + (p.cliente.ref ? ' (' + p.cliente.ref + ')' : ''));
    } else if (p.modo === 'recoger') {
      L.push('Entrega: Recoge en el local · ' + p.hora);
    } else {
      L.push('Entrega: Mesa ' + p.mesa);
    }
    L.push('');
    p.items.forEach(function (it) {
      var pr = IDX[it.id], ops = textoOpciones(pr, it.opts);
      L.push(it.qty + ' × ' + pr.nombre + ' — ' + fmt(it.unit * it.qty));
      if (ops.length) L.push('    ' + ops.join(', '));
      if (it.nota) L.push('    Nota: ' + it.nota);
    });
    L.push('');
    L.push('Subtotal: ' + fmt(p.subtotal));
    if (p.modo === 'domicilio') L.push('Domicilio: ' + (p.domicilio ? fmt(p.domicilio) : 'Gratis'));
    L.push('*Total: ' + fmt(p.total) + '*');
    L.push('');
    var pg = p.pago;
    L.push('Pago: ' + pg.nombre + (pg.llave ? ' (llave ' + pg.llave + ')' : '') + (pg.numero ? ' (' + pg.numero + ')' : ''));
    if (pg.cambio && p.cambio) L.push('Paga con: ' + p.cambio);
    if (pg.llave || pg.numero) L.push('Envío el comprobante en este chat.');
    if (p.nota) { L.push(''); L.push('Nota: ' + p.nota); }
    return L.join('\n');
  }
  function enlaceWA(texto) {
    var num = String(R.whatsapp || '').replace(/\D/g, '');
    return 'https://wa.me/' + (num || '') + '?text=' + encodeURIComponent(texto);
  }

          (DEMO || !R.whatsapp ? '<p class="ayuda">En la demostración WhatsApp te deja elegir el chat. En la carta real va directo al número del restaurante.</p>' : '') + '</li>' +

  /* ───────── asistente "¿no sabes qué pedir?" ───────── */
  function verAsistente() {
    var paso = { personas: 1, antojo: null, presupuesto: 'medio' };
    function chips(name, lista, val) {
      return '<div class="chips" role="radiogroup">' + lista.map(function (x) {
        return '<button type="button" class="chip" role="radio" aria-checked="' + (val === x[0]) + '" data-a="' + name + '" data-v="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div>';
    }
    function pintar() {
      var cuerpo =
        '<div class="asist-q"><h3>¿Para cuántos?</h3>' + chips('personas', [[1, 'Solo yo'], [2, 'Para dos'], [4, '3 o más']], paso.personas) + '</div>' +
        '<div class="asist-q"><h3>¿Qué se te antoja?</h3>' + chips('antojo', R.asistente.antojos.map(function (a) { return [a.id, a.label]; }), paso.antojo) + '</div>' +
        '<div class="asist-q"><h3>¿Cuánto quieres gastar por persona?</h3>' + chips('presupuesto', [['bajo', 'Poco'], ['medio', 'Normal'], ['alto', 'Darme un gusto']], paso.presupuesto) + '</div>' +
        '<div id="asist-res" aria-live="polite">' + resultados() + '</div>';
      var h = hoja('hoja-asistente', 'Te ayudamos a elegir', cuerpo);
      h.onclick = function (ev) {
        var b = ev.target.closest('[data-a]'); if (!b) return;
        var k = b.getAttribute('data-a'), v = b.getAttribute('data-v');
        paso[k] = k === 'personas' ? +v : v;
        var y = $('.hoja-cuerpo', h).scrollTop; pintar(); $('.hoja-cuerpo', h).scrollTop = y;
      };
      return h;
    }
    function resultados() {
      if (!paso.antojo) return '<p class="ayuda">Elige un antojo y te mostramos tres opciones.</p>';
      var cand = todos().filter(function (p) { return !p.agotado && (p.antojos || []).indexOf(paso.antojo) > -1; });
      // el presupuesto se mide contra el precio por persona de lo que coincide con el antojo
      var pp = cand.map(function (p) { return p.precio / (p.personas || 1); }).sort(function (a, b) { return a - b; });
      function qc(n) { return pp[Math.floor((pp.length - 1) * n)] || 0; }
      var tope = paso.presupuesto === 'bajo' ? qc(0.4) : paso.presupuesto === 'medio' ? qc(0.85) * 1.15 : Infinity;
      cand.forEach(function (p) {
        var s = 0, porPersona = p.precio / (p.personas || 1);
        if ((p.tags || []).indexOf('popular') > -1) s += 3;
        if ((p.tags || []).indexOf('nuevo') > -1) s += 1;
        if (paso.personas > 1 && (p.personas || 1) >= paso.personas) s += 7;
        else if (paso.personas > 1 && ((p.tags || []).indexOf('compartir') > -1 || (p.personas || 1) > 1)) s += 4;
        if (paso.personas === 1 && (p.personas || 1) > 1) s -= 5;
        if (porPersona <= tope) s += 2; else s -= 3;
        if (paso.presupuesto === 'alto') s += porPersona / 20000;
        p._s = s;
      });
      cand.sort(function (a, b) { return b._s - a._s; });
      cand = cand.slice(0, 3);
      if (!cand.length) return '<p class="ayuda">Con esa combinación no hay opciones. Prueba otro antojo.</p>';
      return '<h3 class="asist-tit">Te recomendamos</h3><ul class="asist-lista">' + cand.map(function (p) {
        var cant = paso.personas > 1 && !(p.personas > 1) && (p.tags || []).indexOf('compartir') < 0 ? paso.personas === 4 ? 3 : 2 : 1;
        return '<li><button type="button" class="asist-item" data-ver="' + p.id + '"><strong>' + esc(p.nombre) + '</strong><small>' + esc(p.desc) + '</small></button>' +
          '<span class="asist-precio">' + fmt(p.precio) + (cant > 1 ? ' <small>× ' + cant + '</small>' : '') + '</span></li>';
      }).join('') + '</ul>';
    }
    pintar(); abrir('hoja-asistente');
  }

  function leerRuta() {
    var h = (location.hash || '').replace('#', '');
    var m = h.match(/^(?:([a-z0-9]+)-)?mesa-(\d{1,3})$/) || h.match(/^([a-z0-9]+)()$/);
    var q = new URLSearchParams(location.search);
    var slug;
    if (!DEMO && window.CARTA_SLUG) slug = window.CARTA_SLUG;   // carta real: siempre su restaurante
    else slug = (m && m[1] && CARTAS[m[1]]) ? m[1] : (q.get('r') && CARTAS[q.get('r')] ? q.get('r') : (window.CARTA_SLUG || Object.keys(CARTAS)[0]));
    var mesa = (m && m[2]) || q.get('mesa');
    return { slug: slug, mesa: mesa };
  }

  function iniciar() {
    var ruta = leerRuta();
    if (/^cat-/.test((location.hash || '').slice(1)) && R) return; // salto a sección
    cerrarTodo();
    R = CARTAS[ruta.slug]; IDX = {}; CAT_DE = {};
    R.categorias.forEach(function (c) { c.productos.forEach(function (p) { IDX[p.id] = p; CAT_DE[p.id] = c.id; }); });
    S = { cart: [], modo: R.modos[0], mesa: null, filtros: [], q: '', zona: null };
    cargarCarrito();
    if (ruta.mesa && R.modos.indexOf('mesa') > -1) { S.modo = 'mesa'; S.mesa = ruta.mesa; }
    aplicarMarca(); pintarTodo();
    window.scrollTo(0, 0);
  }

    var t = ev.target;
    var b;
    if ((b = t.closest('[data-cat]'))) {
      ev.preventDefault();
      var s = document.getElementById('cat-' + b.getAttribute('data-cat'));
      if (s) s.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    if ((b = t.closest('[data-mas]'))) {
      var p = IDX[b.getAttribute('data-mas')];
      if (b.hasAttribute('data-desde-aviso')) ocultarAviso();
      if (necesitaFicha(p) && !b.closest('.hoja')) { verProducto(p.id); return; }
      if (necesitaFicha(p) && b.closest('.hoja')) { agregar(p.id, opcionesPorDefecto(p), 1, ''); }
      else agregar(p.id, {}, 1, '');
      if (b.hasAttribute('data-refrescar')) verCarritoSinAbrir();
      return;
    }
    if ((b = t.closest('[data-ver]'))) { if (b.closest('#hoja-asistente')) cerrar(); verProducto(b.getAttribute('data-ver')); return; }
    if (t.closest('[data-carrito]')) { verCarrito(); return; }
    if (t.closest('[data-checkout]')) { verCheckout(); return; }
    if (t.closest('[data-asistente]')) { verAsistente(); return; }
    if (t.closest('[data-info]')) { verInfo(); return; }
    if (t.closest('[data-reservar]')) { verReserva(); return; }
    if ((b = t.closest('[data-modo]'))) {
      S.modo = b.getAttribute('data-modo'); guardarCarrito(); pintarCabecera(); pintarBarra(); return;
    }
    if ((b = t.closest('[data-filtro]'))) {
      var f = b.getAttribute('data-filtro'), i = S.filtros.indexOf(f);
      if (i > -1) S.filtros.splice(i, 1); else S.filtros.push(f);
      b.setAttribute('aria-pressed', i < 0); pintarMenu(); return;
    }
    if (t.closest('[data-limpiar]')) { S.q = ''; S.filtros = []; pintarNav(); pintarMenu(); return; }
    if (t.closest('[data-repetir]')) {
      var u = store.get('carta:' + R.slug + ':ultimo'), n = 0;
      (u.items || []).forEach(function (it) { if (IDX[it.id] && !IDX[it.id].agotado) { S.cart.push({ key: it.id + '|' + JSON.stringify(it.opts) + '|' + (it.nota || ''), id: it.id, opts: it.opts, qty: it.qty, nota: it.nota || '', unit: precioLinea(IDX[it.id], it.opts) }); n++; } });
      guardarCarrito(); pintarBarra(); pintarMenu();
      aviso(n ? 'Agregamos tu último pedido. Revísalo antes de confirmar.' : 'Los productos de tu último pedido no están disponibles hoy.');
      return;
    }
  });
  var tq = null;
  document.addEventListener('input', function (ev) {
    if (ev.target.id !== 'q') return;
    clearTimeout(tq);
    tq = setTimeout(function () { S.q = ev.target.value.trim(); pintarMenu(); }, 120);
  });
  window.addEventListener('hashchange', iniciar);
  setInterval(function () { if (R && licenciaVigente() && !pila.length) pintarCabecera(); }, 60000);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

</script>
</body>
</html>
